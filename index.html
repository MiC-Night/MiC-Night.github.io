<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>McNight Thao | About Me</title>
    <style>
        :root {
            --bg-color: #e5e7eb;
            --paper-white: #ffffff;
            --text-color: #333333;
            --clippy-bg: #ffffcc;
        }

        body {
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            font-family: 'Times New Roman', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        /* --- FULLSCREEN MODAL --- */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            padding-top: 50px;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.9);
            cursor: zoom-out;
        }

        .modal-content {
            margin: auto;
            display: block;
            max-width: 90%;
            max-height: 85vh;
            border: 10px solid white;
            box-shadow: 0 0 20px rgba(255,255,255,0.2);
        }

        .close {
            position: absolute;
            top: 15px;
            right: 35px;
            color: #f1f1f1;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
        }

        /* --- DOCUMENT STRUCTURE --- */
        .document {
            background-color: var(--paper-white);
            width: 100%;
            max-width: 850px;
            min-height: 1100px;
            margin: 60px 0;
            padding: 60px 80px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            box-sizing: border-box;
            position: relative;
        }

        .hero-container {
            position: relative;
            width: 100%;
            display: flex;
            justify-content: flex-end;
            margin-bottom: 40px;
        }

        /* POLAROID STYLING */
        .polaroid {
            background: white;
            padding: 15px 15px 30px 15px; /* Wider bottom for the caption */
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transform: rotate(2deg); /* Organic tilt */
            width: 180px;
            text-align: center;
            cursor: zoom-in;
            transition: transform 0.3s ease;
            border: 1px solid #ddd;
        }

        .polaroid:hover {
            transform: rotate(0deg) scale(1.05);
            z-index: 20;
        }

        .polaroid img {
            width: 100%;
            height: auto;
            display: block;
            margin-bottom: 12px;
        }

        .polaroid-caption {
            font-family: 'Permanent Marker', cursive, 'Courier New'; /* Marker font looks great here */
            font-size: 14px;
            color: #222;
            line-height: 1.2;
        }

        .bobby-pin {
            position: absolute;
            top: -25px;
            right: 100px; /* Aligned with polaroid position */
            width: 12px;
            height: 50px;
            background-color: #333;
            border-radius: 10px;
            z-index: 30;
            pointer-events: none;
            box-shadow: 1px 1px 3px rgba(0,0,0,0.3);
        }
        
        .bobby-pin::after {
            content: '';
            position: absolute;
            top: 0; left: 50%;
            transform: translateX(-50%);
            width: 20px; height: 8px;
            background-color: #333;
            border-radius: 5px;
        }

        /* --- TEXT & CURSOR --- */
        .content {
            line-height: 1.6;
            color: var(--text-color);
            font-size: 18px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .cursor {
            display: inline-block;
            width: 10px;
            height: 1.1em;
            background-color: var(--text-color);
            margin-left: 2px;
            vertical-align: bottom;
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* --- CLIPPY --- */
        #clippy-container {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        #speech-bubble {
            background: var(--clippy-bg);
            border: 1px solid black;
            border-radius: 10px;
            padding: 15px;
            width: 200px;
            margin-bottom: 10px;
            display: none;
            font-family: 'Arial', sans-serif;
            font-size: 13px;
            position: relative;
            box-shadow: 3px 3px 0px rgba(0,0,0,0.1);
        }

        #speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -10px;
            right: 20px;
            border-width: 10px 10px 0 10px;
            border-style: solid;
            border-color: black transparent transparent transparent;
        }

        .clippy-icon {
            width: 150px;
            cursor: pointer;
        }

        .clippy-icon img { width: 100%; }

        @media (max-width: 768px) {
            .document { padding: 40px 30px; }
            .hero-container { justify-content: center; }
        }
    </style>
</head>
<body>

    <div id="imageModal" class="modal" onclick="closeModal()">
        <span class="close">&times;</span>
        <img class="modal-content" id="imgFull">
    </div>

    <div class="document">
        <div class="hero-container">
            <div class="bobby-pin"></div>
            <div class="polaroid" onclick="openModal(document.getElementById('heroImg'))">
                <img src="../assets/img/mcnight_gb.jpg" alt="McNight Thao" id="heroImg">
                <div class="polaroid-caption">
                    <strong>McNight Thao</strong><br>
                    Existential Nomad
                </div>
            </div>
        </div>

        <div class="content">
            <span id="typewriter-text"></span><span class="cursor"></span>
        </div>
    </div>

    <div id="clippy-container" onclick="toggleMenu()">
        <div id="speech-bubble">
            <strong>It looks like you're trying to explore this site.</strong> Would you like help?
            <ul style="margin: 10px 0 0 0; padding: 0; list-style: none;">
                <li><a href="www.mcnight-thao.com" style="color: blue; text-decoration: none;">> About Me</a></li>
                <li><a href="www.mcnight-thao.com/Fundraisers" style="color: blue; text-decoration: none;">> Fundraisers</a></li>
            </ul>
        </div>
        <div class="clippy-icon">
            <img src="assets/img/clippy.gif" alt="Clippy">
        </div>
    </div>

    <script>
        // Name and title removed from the string to prevent double-display
        const text = `
THE "SHORT" STORY
My personal journey looks less like a straight line and more like a scenic route... (Click Clippy to naviate site!)

THE JOURNEY: FROM CODE TO COMMUNITY
• The Tech Roots: It all started at a technical magnet high school. That foundation led me to earn my Bachelor’s degree in Computer Engineering.
• The Cubicle Crisis: My first "real" job was coding for a startup. The reality of staring at a screen led to major burnout. I realized I was missing a human connection.
• The Pivot: After a reality check, I took an IT role at a local high school. I realized I didn’t just want to work with hardware; I wanted to work with people.
• The Season of "Yes": I spent years volunteering across the city. Through this, I met a mentor who introduced me to a grassroots nonprofit with a massive dream.

THE LEAP OF FAITH
I took a two-week solo trip to Switzerland to clear my head. I came back, traded my "Senior Programmer" title for a mission I believed in, and stepped into my true calling.

MY PHILOSOPHY
"Your journey through LIFE isn't always straight lines. Sometimes the detour ends up being the real destination."`;

        let i = 0;
        const speed = 15;

        function typeWriter() {
            if (i < text.length) {
                document.getElementById("typewriter-text").textContent += text.charAt(i);
                i++;
                setTimeout(typeWriter, speed);
            }
        }

        function toggleMenu() {
            const bubble = document.getElementById('speech-bubble');
            bubble.style.display = (bubble.style.display === 'block') ? 'none' : 'block';
        }

        function openModal(imgElement) {
            document.getElementById("imageModal").style.display = "block";
            document.getElementById("imgFull").src = imgElement.src;
        }

        function closeModal() {
            document.getElementById("imageModal").style.display = "none";
        }

        window.onload = typeWriter;
    </script>
</body>
</html>
